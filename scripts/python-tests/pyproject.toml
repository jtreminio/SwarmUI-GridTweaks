[project]
name = "gridtweaks-python-tests"
version = "0.0.0"
requires-python = ">=3.11,<3.14"
dependencies = [
    "lpips==0.1.4",
    "numpy>=2,<3",
    "Pillow>=11,<13",
    "pip>=25,<27",
    "scipy>=1.14,<2",
    "torch>=2.5,<3",
    "torchvision>=0.20,<1",
    "tqdm>=4,<5",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform != 'darwin'" }]
torchvision = [{ index = "pytorch-cpu", marker = "sys_platform != 'darwin'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
